name: Build Electron App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-14
            platform: mac
            arch: arm64
          - os: macos-14
            platform: mac
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.platform }} app
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}

      - name: List build output
        if: matrix.platform == 'mac'
        run: ls -la dist-electron

      - name: List build output
        if: matrix.platform == 'win'
        run: dir dist-electron

      - name: Upload Windows installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-electron/
          retention-days: 5

      - name: Upload Mac installer
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer-${{ matrix.arch }}
          path: dist-electron/
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release

      - name: Download Mac arm64 installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer-arm64
          path: release

      - name: Download Mac x64 installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer-x64
          path: release

      - name: List release files
        run: ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
